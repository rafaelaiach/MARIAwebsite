# Netlify reads this file: the site to publish is the site/ folder, there is no build step.
[build]
  publish = "site"
  command = ""

# Photos and fonts never change name without changing content: browsers may keep them a long time.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
